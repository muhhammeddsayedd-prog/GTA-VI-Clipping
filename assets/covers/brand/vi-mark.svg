<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 96" width="150" height="96">
  <title>6 Stars Clips VI mark</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3DAE"/>
      <stop offset="1" stop-color="#FF9F2E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- dark backing so the mark reads on bright frames -->
  <g fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 14 L46 82 L72 14"/><path d="M100 14 L100 82"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 14 L46 82 L72 14"/><path d="M100 14 L100 82"/>
  </g>
  <g fill="none" stroke="#FFF6FB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 14 L46 82 L72 14"/><path d="M100 14 L100 82"/>
  </g>
  <path d="M128 10 l7 -7 l7 7 l-7 7 z" fill="#FFD400"/>
</svg>
