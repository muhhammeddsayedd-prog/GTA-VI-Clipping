name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict src/

      - name: Unit tests
        run: uv run pytest tests/unit

      # Plain Postgres has no Supabase storage schema, so the bucket insert at the end of 0001 needs a
      # stub table. Nothing else in the migrations depends on Supabase.
      - name: Apply migrations to the test database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists storage; create table if not exists storage.buckets (id text primary key, name text, public bool);"
          for file in supabase/migrations/*.sql; do
            echo "applying $file"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Integration tests
        run: uv run pytest tests/integration -rs

  web:
    name: console (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The browser bundle must never carry a server secret or the control API token.
      - name: No secrets in client bundles
        run: |
          if grep -rIlE "DASHBOARD_API_TOKEN|SUPABASE_SERVICE_ROLE|DEV_ADMIN_PASSWORD|SESSION_SECRET" .next/static; then
            echo "secret name found in a client bundle"; exit 1
          fi
